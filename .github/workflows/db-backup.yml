# Nightly backup of the production database (milkywayy-web, Supabase Free plan: no built-in
# backups). pg_dump (schema + data) → gzip → private R2 bucket "milkywayy-backups", newest 14 kept.
# Restore: LAUNCH.md → "Restore from backup". Secrets live in GitHub → Settings → Secrets → Actions.
name: Database backup

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUCKET: milkywayy-backups
      KEEP: 14
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 doesn't take the newer default checksums of AWS CLI v2.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Install pg_dump 17 (matches the server)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump and compress
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          set -euo pipefail
          FILE="milkywayy-web-$(date -u +%Y-%m-%d).sql.gz"
          PGD=/usr/lib/postgresql/17/bin/pg_dump
          # Restorable into a fresh Supabase project (LAUNCH.md): our schemas' structure, then
          # every row incl. sign-ins (auth data; a new project already has the auth tables).
          {
            "$PGD" "$PROD_DB_URL" --schema-only --no-owner --no-privileges \
              --schema=public --schema=private --schema=supabase_migrations
            echo "SET session_replication_role = replica;"
            "$PGD" "$PROD_DB_URL" --data-only --no-owner --no-privileges \
              --schema=public --schema=private --schema=supabase_migrations --schema=auth \
              --exclude-table-data=auth.schema_migrations
          } | gzip -9 > "$FILE"
          gzip -t "$FILE"
          SIZE=$(stat -c %s "$FILE")
          echo "Dump: $FILE ($SIZE bytes)"
          [ "$SIZE" -gt 20000 ] || { echo "Dump is suspiciously small. Stopping."; exit 1; }
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      - name: Upload to R2 and keep the newest 14
        run: |
          set -euo pipefail
          EP="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          aws s3 cp "$FILE" "s3://$BUCKET/$FILE" --endpoint-url "$EP" --only-show-errors
          aws s3 ls "s3://$BUCKET/" --endpoint-url "$EP" \
            | awk '{print $4}' | grep -E '^milkywayy-web-[0-9-]+\.sql\.gz$' | sort -r \
            | tail -n +$((KEEP + 1)) \
            | while read -r old; do
                aws s3 rm "s3://$BUCKET/$old" --endpoint-url "$EP" --only-show-errors
                echo "Removed $old"
              done
          echo "Backups now:"
          aws s3 ls "s3://$BUCKET/" --endpoint-url "$EP" | awk '{print $1, $3, $4}'
